[project]
name = "support-inbox-triage-agent"
version = "0.1.0"
description = "Shared support inbox triage: classify, label, draft replies (drafts only), guard against prompt injection, report."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "google-api-python-client",
    "google-auth-oauthlib",
    "loguru",
    "pydantic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "starlette",
    "httpx",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.semgrep/", "^\\.claude/", "^scripts/"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/security"]
